name: Production deploy signal

on:
  push:
    branches: [main]
    paths-ignore:
      - 'work/**'
      - '.github/workflows/deploy-signal.yml'
      - 'docs/deployment-workflow.md'

permissions:
  contents: read
  id-token: write

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request production admission
        env:
          OIDC_AUDIENCE: https://api.stensibly.com/internal/deploy-governor/candidate
        run: |
          set -euo pipefail
          encoded_audience="$(jq -nr --arg value "$OIDC_AUDIENCE" '$value|@uri')"
          token_response="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 15 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"
          oidc_token="$(jq -er '.value | select(type == "string" and length > 32)' <<<"$token_response")"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 5 --max-time 20 \
            --retry 2 --retry-all-errors --retry-delay 1 \
            -X POST \
            -H "Authorization: Bearer $oidc_token" \
            "$OIDC_AUDIENCE"
