name: Generate orphan dependency prune

on:
  push:
    branches:
      - cleanup/prune-orphan-ui-dependencies

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message != 'Prune orphan dependencies with pnpm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/prune-orphan-ui-dependencies
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Remove proven orphan dependencies
        run: >-
          pnpm remove
          @anthropic-ai/sdk
          @aws-sdk/client-cloudfront
          @aws-sdk/client-s3
          @heroicons/react
          @hookform/resolvers
          @radix-ui/react-label
          @radix-ui/themes
          @tanstack/react-query
          @vercel/postgres
          @virtuoso.dev/message-list
          @types/bcrypt
          @types/pg
          @types/react-beautiful-dnd
          @types/react-syntax-highlighter
          @types/uuid
          @types/ws
          bcryptjs
          drizzle-zod
          mitt
          modern-monaco
          node-vibrant
          pg
          react-hook-form
          react-icons
          react-syntax-highlighter
          react-virtuoso
          swr
          use-debounce
          uuid
          ws
          zustand
          --reporter=silent
      - name: Commit generated manifest and lockfile
        run: |
          git diff --check
          git diff --stat -- package.json pnpm-lock.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml
          git commit -m 'Prune orphan dependencies with pnpm'
          git push origin HEAD:cleanup/prune-orphan-ui-dependencies
