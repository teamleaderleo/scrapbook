name: Import Fifth Drawer artwork once

on:
  push:
    branches:
      - agent-check-in/fifth-drawer-scrapbook-pod
    paths:
      - .github/workflows/import-fifth-drawer-once.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the check-in branch
        uses: actions/checkout@v6
        with:
          ref: agent-check-in/fifth-drawer-scrapbook-pod
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Authenticate to Google Drive
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.SCRAPBOOK_GDRIVE_CREDENTIALS }}
          service_account: ${{ fromJSON(secrets.SCRAPBOOK_GDRIVE_CREDENTIALS).client_email }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false

      - name: Download and import the staged artwork
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/gallery-import
          curl \
            --fail \
            --location \
            --max-filesize 12582912 \
            --show-error \
            --silent \
            --header "Authorization: Bearer $DRIVE_ACCESS_TOKEN" \
            "https://www.googleapis.com/drive/v3/files/16Xjqlb6QW6_0mQX2sMgtU615LAdmyvfl?alt=media" \
            --output .tmp/gallery-import/source-image
          node scripts/import-gallery-asset.mjs \
            .tmp/gallery-import/source-image \
            fifth-drawer-scrapbook-pod

      - name: Commit the repository-owned WebP
        run: |
          set -euo pipefail
          output="public/gallery/agents/fifth-drawer-scrapbook-pod.webp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$output"
          if git diff --cached --quiet; then
            echo "The branch already contains the same optimised artwork."
            exit 0
          fi
          git commit -m "gallery: import artwork for fifth-drawer-scrapbook-pod"
          git push origin HEAD:agent-check-in/fifth-drawer-scrapbook-pod
