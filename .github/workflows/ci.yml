name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      run_verify: ${{ steps.classify.outputs.run_verify }}
      run_browser: ${{ steps.classify.outputs.run_browser }}
      browser_groups: ${{ steps.classify.outputs.browser_groups }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Classify change
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          base_sha="$PUSH_BASE_SHA"
          head_sha="$CURRENT_SHA"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          fi

          : > /tmp/scrapbook-changed-paths.txt

          if [[ -n "$base_sha" && \
                "$base_sha" != "0000000000000000000000000000000000000000" && \
                -n "$head_sha" ]]; then
            if git cat-file -e "${base_sha}^{commit}" 2>/dev/null && \
               git cat-file -e "${head_sha}^{commit}" 2>/dev/null; then
              git diff --name-only "$base_sha" "$head_sha" > /tmp/scrapbook-changed-paths.txt
            fi
          fi

          node scripts/ci-change-classifier-cli.mjs \
            < /tmp/scrapbook-changed-paths.txt \
            >> "$GITHUB_OUTPUT"

  verify:
    needs: classify
    if: needs.classify.outputs.run_verify == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent

      - name: Lint
        run: pnpm lint > lint.log 2>&1
      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-log
          path: lint.log

      - name: Typecheck
        run: pnpm typecheck > typecheck.log 2>&1
      - name: Upload typecheck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-log
          path: typecheck.log

      - name: Unit tests
        run: pnpm test > test.log 2>&1
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Build
        run: pnpm build > build.log 2>&1
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  e2e:
    needs: classify
    if: github.event_name == 'pull_request' && needs.classify.outputs.run_browser == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      BROWSER_GROUPS: ${{ needs.classify.outputs.browser_groups }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent
      - name: Install Chrome dependencies
        run: pnpm exec playwright install-deps chromium
      - name: Chromium regressions
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BROWSER_GROUPS" == "full" || -z "$BROWSER_GROUPS" ]]; then
            pnpm exec playwright test --project=chromium > playwright.log 2>&1
            exit 0
          fi

          declare -A selected_specs=()
          add_spec() {
            selected_specs["$1"]=1
          }

          IFS=',' read -ra groups <<< "$BROWSER_GROUPS"
          for group in "${groups[@]}"; do
            case "$group" in
              home)
                add_spec tests/e2e/activity-paper-marks.spec.ts
                add_spec tests/e2e/activity-scoreboard-selection.spec.ts
                add_spec tests/e2e/home-now-shelf.spec.ts
                add_spec tests/e2e/homepage-density.spec.ts
                add_spec tests/e2e/operator-console.spec.ts
                ;;
              desk)
                add_spec tests/e2e/bot-desk.spec.ts
                ;;
              navigation)
                add_spec tests/e2e/site-navigation.spec.ts
                ;;
              shell)
                add_spec tests/e2e/visual-shell.spec.ts
                ;;
              activity-lab)
                add_spec tests/e2e/activity-field-lab.spec.ts
                ;;
              *)
                echo "Unknown browser group: $group" >&2
                exit 1
                ;;
            esac
          done

          specs=("${!selected_specs[@]}")
          printf 'Scoped Chromium specs:\n' > playwright.log
          printf ' - %s\n' "${specs[@]}" >> playwright.log
          pnpm exec playwright test --project=chromium "${specs[@]}" >> playwright.log 2>&1
      - name: Upload homepage visual review
        if: always() && (needs.classify.outputs.browser_groups == 'full' || contains(needs.classify.outputs.browser_groups, 'home'))
        uses: actions/upload-artifact@v4
        with:
          name: homepage-visual-review
          path: test-results/homepage-density/after
          if-no-files-found: ignore
      - name: Upload activity lab visual review
        if: always() && (needs.classify.outputs.browser_groups == 'full' || contains(needs.classify.outputs.browser_groups, 'activity-lab'))
        uses: actions/upload-artifact@v4
        with:
          name: activity-lab-visual-review
          path: test-results/**/activity-field-*.png
          if-no-files-found: ignore
      - name: Upload gallery visual review
        if: always() && needs.classify.outputs.browser_groups == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: gallery-visual-review
          path: test-results/gallery-repair
          if-no-files-found: ignore
      - name: Upload sigil lab visual review
        if: always() && needs.classify.outputs.browser_groups == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: sigil-lab-visual-review
          path: test-results/sigil-lab-review
          if-no-files-found: ignore
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: chromium-failure-diagnostics
          path: |
            playwright.log
            test-results
          if-no-files-found: ignore
