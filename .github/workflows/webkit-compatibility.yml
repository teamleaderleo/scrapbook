name: WebKit compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'

concurrency:
  group: webkit-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webkit:
    name: WebKit browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --reporter=silent
      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit
      - name: WebKit regressions
        run: pnpm exec playwright test --project=webkit > playwright-webkit.log 2>&1
      - name: Upload WebKit failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webkit-failure-diagnostics
          path: |
            playwright-webkit.log
            test-results
          if-no-files-found: ignore
