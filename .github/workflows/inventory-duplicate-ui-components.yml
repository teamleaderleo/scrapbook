name: Inventory duplicate UI components

on:
  push:
    branches:
      - cleanup/retire-duplicate-ui-components

permissions:
  contents: write

jobs:
  inventory:
    if: github.event.head_commit.message != 'Inventory duplicate UI components'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/retire-duplicate-ui-components
      - name: Build inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('components/ui/components')
          source_suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'}
          source_files = [
              path for path in Path('.').rglob('*')
              if path.is_file()
              and path.suffix in source_suffixes
              and not any(part in {'.git', '.next', 'node_modules'} for part in path.parts)
          ]

          inventory = []
          for path in sorted(root.glob('*')):
              if not path.is_file():
                  continue

              alias = '@/' + path.with_suffix('').as_posix()
              relative_tokens = {f'./{path.stem}', f'./{path.name}'}
              references = []

              for candidate in source_files:
                  if candidate == path:
                      continue
                  text = candidate.read_text(encoding='utf-8', errors='ignore')
                  matched = alias in text
                  if candidate.parent == root:
                      matched = matched or any(token in text for token in relative_tokens)
                  if matched:
                      references.append(candidate.as_posix())

              inventory.append({
                  'path': path.as_posix(),
                  'lines': len(path.read_text(encoding='utf-8', errors='ignore').splitlines()),
                  'references': sorted(references),
              })

          output = Path('tmp/ui-components-inventory.json')
          output.parent.mkdir(exist_ok=True)
          output.write_text(json.dumps(inventory, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit inventory
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tmp/ui-components-inventory.json
          git commit -m 'Inventory duplicate UI components'
          git push origin HEAD:cleanup/retire-duplicate-ui-components
