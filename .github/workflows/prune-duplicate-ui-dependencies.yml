name: Prune duplicate UI dependencies

on:
  push:
    branches:
      - cleanup/retire-duplicate-ui-components

permissions:
  contents: write

jobs:
  prune:
    if: github.event.head_commit.message != 'Prune duplicate UI dependencies with pnpm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PNPM_CONFIG_IGNORE_SCRIPTS: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/retire-duplicate-ui-components
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Remove duplicate UI dependencies
        run: pnpm remove @radix-ui/react-toggle @radix-ui/react-toggle-group --reporter=silent
      - name: Commit generated manifest and lockfile
        run: |
          git diff --check
          git diff --stat -- package.json pnpm-lock.yaml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json pnpm-lock.yaml
          git commit -m 'Prune duplicate UI dependencies with pnpm'
          git push origin HEAD:cleanup/retire-duplicate-ui-components
