name: Import gallery asset
run-name: Import gallery asset on ${{ inputs.target_branch || github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: Where the source image is staged
        required: true
        type: choice
        options:
          - drive
          - github-attachment
      source:
        description: Google Drive file ID or GitHub attachment URL
        required: true
        type: string
      entry_id:
        description: Guestbook entry ID and output filename stem
        required: true
        type: string
      target_branch:
        description: Existing branch that should receive the WebP file
        required: true
        type: string
  push:
    branches-ignore:
      - main
    paths:
      - .scrapbook/import-requests/*.json

permissions:
  contents: write

concurrency:
  group: gallery-asset-${{ inputs.target_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      entry_id: ${{ steps.manual.outputs.entry_id || steps.request.outputs.entry_id }}
      source_type: ${{ steps.manual.outputs.source_type || steps.request.outputs.source_type }}
      source: ${{ steps.manual.outputs.source || steps.request.outputs.source }}
      target_branch: ${{ steps.manual.outputs.target_branch || steps.request.outputs.target_branch }}
      request_path: ${{ steps.manual.outputs.request_path || steps.request.outputs.request_path }}
      output_path: ${{ steps.manual.outputs.output_path || steps.request.outputs.output_path }}

    steps:
      - name: Check out the target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}
          fetch-depth: 0

      - name: Resolve manual workflow inputs
        if: github.event_name == 'workflow_dispatch'
        id: manual
        env:
          ENTRY_ID: ${{ inputs.entry_id }}
          SOURCE: ${{ inputs.source }}
          SOURCE_TYPE: ${{ inputs.source_type }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          if [[ ! "$ENTRY_ID" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "Entry ID must be a lowercase kebab-case slug." >&2
            exit 1
          fi

          if [[ ! "$TARGET_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || \
             [[ "$TARGET_BRANCH" == refs/* ]] || \
             [[ "$TARGET_BRANCH" == */ ]] || \
             [[ "$TARGET_BRANCH" == /* ]] || \
             [[ "$TARGET_BRANCH" == *..* ]] || \
             [[ "$TARGET_BRANCH" == main ]]; then
            echo "Target branch must be a safe, existing non-main branch name." >&2
            exit 1
          fi

          printf '%s\n' \
            "entry_id=$ENTRY_ID" \
            "source_type=$SOURCE_TYPE" \
            "source=$SOURCE" \
            "target_branch=$TARGET_BRANCH" \
            "request_path=" \
            "output_path=public/gallery/agents/$ENTRY_ID.webp" \
            >> "$GITHUB_OUTPUT"

      - name: Resolve connector import request
        if: github.event_name == 'push'
        id: request
        env:
          ACTOR: ${{ github.actor }}
          AFTER_SHA: ${{ github.event.after }}
          BEFORE_SHA: ${{ github.event.before }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "$ACTOR" != "teamleaderleo" ]]; then
            echo "Connector import requests are restricted to the repository owner." >&2
            exit 1
          fi

          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            mapfile -t requests < <(
              git diff-tree --no-commit-id --name-only --diff-filter=AM -r "$AFTER_SHA" -- '.scrapbook/import-requests/*.json'
            )
          else
            mapfile -t requests < <(
              git diff --name-only --diff-filter=AM "$BEFORE_SHA" "$AFTER_SHA" -- '.scrapbook/import-requests/*.json'
            )
          fi

          if [[ "${#requests[@]}" -ne 1 ]]; then
            echo "Exactly one added or modified gallery import request is required per push." >&2
            printf 'Observed request paths:\n%s\n' "${requests[*]:-none}" >&2
            exit 1
          fi

          node scripts/validate-gallery-import-request.mjs "${requests[0]}" "$TARGET_BRANCH" "$GITHUB_OUTPUT"

  import:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the target branch
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.target_branch }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --reporter=silent

      - name: Authenticate to Google Drive
        if: needs.resolve.outputs.source_type == 'drive'
        id: google-auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.SCRAPBOOK_GDRIVE_CREDENTIALS }}
          service_account: ${{ fromJSON(secrets.SCRAPBOOK_GDRIVE_CREDENTIALS).client_email }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly
          create_credentials_file: false

      - name: Download staged artwork
        env:
          DRIVE_ACCESS_TOKEN: ${{ steps.google-auth.outputs.access_token }}
          ENTRY_ID: ${{ needs.resolve.outputs.entry_id }}
          SOURCE: ${{ needs.resolve.outputs.source }}
          SOURCE_TYPE: ${{ needs.resolve.outputs.source_type }}
        run: |
          set -euo pipefail

          mkdir -p .tmp/gallery-import
          destination=.tmp/gallery-import/source-image

          case "$SOURCE_TYPE" in
            drive)
              if [[ ! "$SOURCE" =~ ^[A-Za-z0-9_-]+$ ]]; then
                echo "Drive source must be a file ID, not a URL or path." >&2
                exit 1
              fi
              if [[ -z "$DRIVE_ACCESS_TOKEN" ]]; then
                echo "Drive authentication did not produce an access token." >&2
                exit 1
              fi
              curl \
                --fail \
                --location \
                --max-filesize 12582912 \
                --show-error \
                --silent \
                --header "Authorization: Bearer $DRIVE_ACCESS_TOKEN" \
                "https://www.googleapis.com/drive/v3/files/$SOURCE?alt=media" \
                --output "$destination"
              ;;
            github-attachment)
              node --input-type=module - "$SOURCE" <<'NODE'
          const source = process.argv[2];
          const url = new URL(source);
          const allowed =
            (url.hostname === 'github.com' && url.pathname.startsWith('/user-attachments/assets/')) ||
            url.hostname === 'user-images.githubusercontent.com' ||
            url.hostname === 'private-user-images.githubusercontent.com';

          if (url.protocol !== 'https:' || !allowed || url.username || url.password) {
            console.error('Only HTTPS GitHub user-attachment URLs are accepted.');
            process.exit(1);
          }
          NODE
              curl \
                --fail \
                --location \
                --max-filesize 12582912 \
                --max-redirs 5 \
                --show-error \
                --silent \
                "$SOURCE" \
                --output "$destination"
              ;;
            *)
              echo "Unknown source type: $SOURCE_TYPE" >&2
              exit 1
              ;;
          esac

          test -s "$destination"
          node scripts/import-gallery-asset.mjs "$destination" "$ENTRY_ID"

      - name: Commit the repository-owned WebP
        env:
          ENTRY_ID: ${{ needs.resolve.outputs.entry_id }}
          OUTPUT_PATH: ${{ needs.resolve.outputs.output_path }}
          REQUEST_PATH: ${{ needs.resolve.outputs.request_path }}
          TARGET_BRANCH: ${{ needs.resolve.outputs.target_branch }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUTPUT_PATH"

          if [[ -n "$REQUEST_PATH" && -f "$REQUEST_PATH" ]]; then
            git rm "$REQUEST_PATH"
          fi

          if git diff --cached --quiet; then
            echo "The target branch already contains the same optimised artwork."
            exit 0
          fi

          git commit -m "gallery: import artwork for $ENTRY_ID"
          git push origin "HEAD:$TARGET_BRANCH"
