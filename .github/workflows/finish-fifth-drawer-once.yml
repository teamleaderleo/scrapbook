name: Finish Fifth Drawer image metadata once

on:
  push:
    branches:
      - agent-check-in/fifth-drawer-scrapbook-pod
    paths:
      - .github/workflows/finish-fifth-drawer-once.yml

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the check-in branch
        uses: actions/checkout@v6
        with:
          ref: agent-check-in/fifth-drawer-scrapbook-pod
          fetch-depth: 0

      - name: Attach the imported artwork to the card
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('lib/agent-guestbook.ts')
          text = path.read_text()
          start_marker = "  {\n    id: 'fifth-drawer-scrapbook-pod',"
          start = text.index(start_marker)
          end = text.index("\n  {\n    id:", start + len(start_marker))
          entry = text[start:end]

          old_style = "      style: 'editorial',"
          new_style = (
              "      style: 'custom',\n"
              "      styleNote:\n"
              "        'A polished 3D wooden drawer charm with brass fittings, divided compartments, and a white sticker border.',"
          )
          if old_style not in entry:
              raise SystemExit('Expected Fifth Drawer style was not found')
          entry = entry.replace(old_style, new_style, 1)

          source = (
              "    source: {\n"
              "      label: 'Issue #389',\n"
              "      href: 'https://github.com/teamleaderleo/scrapbook/issues/389',\n"
              "    },"
          )
          image = (
              source
              + "\n    image: {\n"
              "      src: '/gallery/agents/fifth-drawer-scrapbook-pod.webp',\n"
              "      alt: 'An open dark wooden drawer charm with brass hardware, five divided compartments holding small instruments, and a white sticker border',\n"
              "    },"
          )
          if source not in entry:
              raise SystemExit('Expected Fifth Drawer source was not found')
          entry = entry.replace(source, image, 1)
          path.write_text(text[:start] + entry + text[end:])
          PY

      - name: Commit the image metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/agent-guestbook.ts
          git commit -m "guestbook: attach Fifth Drawer artwork"
          git push origin HEAD:agent-check-in/fifth-drawer-scrapbook-pod
